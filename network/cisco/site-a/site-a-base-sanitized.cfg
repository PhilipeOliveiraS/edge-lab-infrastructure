! Cisco IOS XE 16.6.4 (Everest) - Sanitized Baseline Config
! Chassis: ISR4331/K9
version 16.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISR4331-SITE-A
!
ip domain name lab.local
!
! Username and secret sanitized for publication
username [ADMIN_USER] privilege 15 secret 9 [REDACTED_SECRET_HASH]
!
no ip http server
no ip http secure-server
!
interface GigabitEthernet0/0/0
 no ip address
 shutdown
!
interface GigabitEthernet0/0/1
 description UPLINK-TO-RB3011-LAN
 ip address dhcp
 negotiation auto
!
interface GigabitEthernet0/0/2
 no ip address
 shutdown
!
ip access-list standard ADMIN-SSH
 permit 192.168.7.58
!
line vty 0 4
 access-class ADMIN-SSH in
 transport input ssh
 login local
!
end
